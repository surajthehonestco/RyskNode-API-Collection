info:
  name: Admin Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/admin/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@rysknode.com",
        "password": "123456"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.token) pm.collectionVariables.set('admin_token', json.token);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
