info:
  name: List Employees
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/admin/employees"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
