info:
  name: employees create
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/customer/employees"
  body:
    type: json
    data: |-
      {
        "name": "Alex Morgan",
        "email": "alex@example.com",
        "number": "9876543210",
        "designation": "Risk Analyst",
        "allocations": [
          {
            "product_slug": "buyer-assessment",
            "credits": 3
          },
          {
            "product_slug": "operational-limit",
            "credits": 2
          }
        ]
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
