info:
  name: employees edit
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/api/customer/employees"
  body:
    type: json
    data: |-
      {
        "name": "Alex Updated",
        "email": "alex@example.com",
        "number": "9876543210",
        "designation": "Senior Risk Analyst",
        "is_active": true,
        "allocations": [
          {
            "product_slug": "buyer-assessment",
            "credits": 3
          }
        ]
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
