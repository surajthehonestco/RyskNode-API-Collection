info:
  name: Pin Wishlist
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{base_url}}/api/customer/watchlists/1/pin"
  body:
    type: json
    data: |-
      {
        "is_pinned": true //false
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
