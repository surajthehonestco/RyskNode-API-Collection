info:
  name: Checkout
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/customer/subscription/checkout"
  body:
    type: json
    data: |-
      {
        "plan_slug": "basic",
        "billing_cycle": "monthly",
        "payment_gateway": "razorpay",
        "billing_information": {
          "billing_name": "Acme Private Limited",
          "contact_number": "+919087785534",
          "billing_email": "billing@example.com",
          "business_gst": "21AAZWRPN7649P9",
          "address_line_1": "The Ruby, Dadar West",
          "address_line_2": "Near station",
          "country": "India",
          "state": "Maharashtra",
          "city": "Mumbai",
          "zip_code": "400028",
          "website": "https://acme.example"
        }
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
