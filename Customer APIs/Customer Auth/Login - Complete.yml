info:
  name: Login - Complete
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/api/customer/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "suraj.paul.69@gmail.com",
        "verification_token": "{{verification_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.token) pm.collectionVariables.set('customer_token', json.token);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
