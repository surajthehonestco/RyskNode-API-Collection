info:
  name: employees list
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/customer/employees?search=Alex&status=active"
  params:
    - name: search
      value: Alex
      type: query
    - name: status
      value: active
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
