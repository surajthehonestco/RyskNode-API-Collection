info:
  name: Send message
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/customer/support-tickets/5/messages"
  body:
    type: json
    data: |
      {
        "message": "Please check this issue.",
        "attachments": [
          "/path/to/screenshot.png"
        ]
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
