info:
  name: Google login
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/api/customer/auth/google-login"
  body:
    type: json
    data: |-
      {
        "provider": "google",
        "provider_account_id": "115358624739945643160",
        "access_token": "GOOGLE_ACCESS_TOKEN"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
