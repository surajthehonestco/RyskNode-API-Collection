info:
  name: Search Directors
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/search?query=trisha&type=directors&limit=10"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: query
      value: trisha
      type: query
    - name: type
      value: directors
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
