info:
  name: Elasticsearch Search Example
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/search?query=twitter&type=all&limit=10"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: query
      value: twitter
      type: query
    - name: type
      value: all
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Uses the same endpoint. Server must have `COMPANY_SEARCH_DRIVER=elasticsearch`, Elasticsearch env values configured, and `php artisan search:sync-companies --fresh` already run.
