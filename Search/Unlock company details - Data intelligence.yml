info:
  name: Unlock company details - Data intelligence
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/customer/company-data/unlock"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "company_id": 1192928,
        "flag": "charges"
      }
  auth:
    type: bearer
    token: "{{customer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
