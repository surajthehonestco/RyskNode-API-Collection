info:
  name: Search Companies
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/search?query=tata&type=companies&limit=10"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: query
      value: tata
      type: query
    - name: type
      value: companies
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
