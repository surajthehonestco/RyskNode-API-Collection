info:
  name: Patch Employee
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/api/admin/employees/{{employee_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "is_active": false
      }
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
